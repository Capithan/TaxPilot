# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - TaxPilotHRB

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent deployments from hammering Azure AD (causes 429 throttle)
concurrency:
  group: deploy-taxpilothrb
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7A0CEF935A4E4FE892BBDB8F2172D39F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9DC74DEAFAE84BF3B10D310AC2661BB8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A702AEBD6E0A415F981C79F7B0BB4A9B }}
        timeout-minutes: 5
        continue-on-error: false

      # OneDeploy can return 409 if a previous deployment is still finalizing.
      # Retrying after a short wait is typically enough to unblock.
      - name: 'Deploy to Azure Web App (attempt 1)'
        id: deploy_attempt_1
        uses: azure/webapps-deploy@v3
        continue-on-error: true
        with:
          app-name: 'TaxPilotHRB'
          slot-name: 'Production'
          package: .

      - name: 'Wait before retry (attempt 2)'
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 30

      - name: 'Deploy to Azure Web App (attempt 2)'
        id: deploy_attempt_2
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        continue-on-error: true
        with:
          app-name: 'TaxPilotHRB'
          slot-name: 'Production'
          package: .

      - name: 'Wait before retry (attempt 3)'
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        run: sleep 60

      - name: 'Deploy to Azure Web App (attempt 3)'
        id: deploy_attempt_3
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TaxPilotHRB'
          slot-name: 'Production'
          package: .
          